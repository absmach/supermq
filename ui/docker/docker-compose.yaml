services:
  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: ghcr.io/absmach/fluxmq-dashboard:latest
    ports:
      - "3000:3000"
    environment:
      FLUXMQ_API_URL: ${FLUXMQ_API_URL:-http://localhost:8082}
      FLUXMQ_NODE_URLS: ${FLUXMQ_NODE_URLS:-http://localhost:8082}
    restart: unless-stopped
