name: UI

on:
  push:
    branches:
      - main
    paths:
      - "ui/**"
  pull_request:
    paths:
      - "ui/**"

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: pnpm/action-setup@v5
        with:
          version: 10
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline
        working-directory: ./ui

      - name: Lint
        run: pnpm run lint
        working-directory: ./ui

      - name: Build
        run: pnpm run build
        working-directory: ./ui
